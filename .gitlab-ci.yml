# Pipelines run for merge requests and for pushes to main.
#   build_pdf:        builds bible.pdf with latexmk, the same way the local build
#                     does, and fails on a LaTeX error.
#   pages:            main only. Publishes the freshly built bible.pdf (and the
#                     README's page-count badge data) to GitLab Pages, at
#                     https://colby.goettel.gitlab.io/bible/bible.pdf. The PDF is
#                     not committed to the repository.
#   mirror_to_github: the shared GitLab → GitHub mirror job from smart-home's
#                     ci/templates/mirror-to-github.yml (smart-home #299). Runs on
#                     main only. This repo keeps its own GITHUB_DEPLOY_KEY CI variable.
#
# Every job runs on this repo's own in-cluster runner (smart-home
# kubernetes/bible-runner on deskf02). Shared GitLab-hosted runners are disabled
# on the project.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

default:
  tags:
    - self-hosted

include:
  - project: colby.goettel/smart-home
    ref: main
    file: ci/templates/mirror-to-github.yml

stages:
  - build
  - publish

build_pdf:
  stage: build
  # TeX Live 2026, full scheme, pinned by digest so the build doesn't shift under
  # the published PDF. Bump it on purpose, alongside the local TeX Live.
  image: texlive/texlive:latest@sha256:07e8062637249c4f780ca59f42cc2ed592bc2dc1db4320769406aee3f98aa70e
  script:
    # latexmk exits non-zero even when it writes the PDF, because per-page
    # footnote numbering never settles (see .latexmkrc). So judge the build by
    # its log and output instead: xelatex runs with -halt-on-error, so a real
    # LaTeX error leaves a "!" line in bible.log and no bible.pdf.
    - latexmk bible.tex || true
    - if grep -n -A5 '^!' bible.log; then exit 1; fi
    - test -s bible.pdf
    # The README's page-count badge reads this through a shields.io endpoint.
    - pages=$(sed -n 's/^Output written on bible.xdv (\([0-9]*\) pages.*/\1/p' bible.log)
    - >-
      printf '{"schemaVersion": 1, "label": "pages", "message": "%s", "color": "blue"}\n' "$pages" > pages-badge.json
    - cat pages-badge.json
  artifacts:
    when: always
    paths:
      - bible.pdf
      - bible.log
      - pages-badge.json
    expire_in: 1 week

pages:
  stage: publish
  image: alpine:3.22
  needs: [build_pdf]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - mkdir -p public
    - cp bible.pdf pages-badge.json public/
    # The site root forwards to the PDF.
    - >-
      printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=bible.pdf"><title>The Holy Bible</title><a href="bible.pdf">The Holy Bible (PDF)</a>\n' > public/index.html
  artifacts:
    paths:
      - public
